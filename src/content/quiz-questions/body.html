<header>
  <div class="wrap qbar">
    <a href="/" class="mark" aria-label="vision, retour au site">visi<span class="blip eye" data-pose="eye" data-color="brand"></span>n</a>
    <div class="prog" id="prog" aria-hidden="true"></div>
    <span class="qcount" id="qcount" aria-live="polite">Question 1 sur 7</span>
  </div>
</header>

<main class="qmain">
  <div class="wrap qgrid">
    <div>
      <button class="back" id="back" hidden>← Question précédente</button>
      <div class="stage" id="stage"></div>
    </div>

    <aside class="profile" aria-label="Récapitulatif de vos réponses">
      <div class="panel">
        <div class="panel-head">
          <span>Votre profil</span>
          <span class="live"><i></i> se précise</span>
        </div>
        <dl id="prows" style="margin:0"></dl>
        <span class="blip panel-blip b2" id="pblip" data-pose="look" data-color="yellow"></span>
      </div>
    </aside>
  </div>
</main>
