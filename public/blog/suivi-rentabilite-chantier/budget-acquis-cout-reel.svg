<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Budget acquis et coût réel par poste après trois mois de chantier : main-d'œuvre −3 325 €, matériaux −500 €, matériel −375 €, sous-traitance 0 €, frais de chantier −310 € (chiffres fictifs)</title>
  <rect width="1200" height="640" rx="28" fill="#FAF9F6"/>

  <text x="48" y="66" font-size="14" font-weight="700" letter-spacing="2" fill="#5A4BFF">ÉTAPE 4 · À AVANCEMENT COMPARABLE</text>
  <text x="48" y="100" font-size="26" font-weight="800" fill="#14151A">Poste par poste : budget acquis et coût réel</text>
  <text x="1152" y="128" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#6C6A66" text-anchor="end">ÉCART</text>
  <rect x="36" y="136" width="1128" height="72" rx="14" fill="#FFF3F1"/>
  <text x="48" y="166" font-size="17" font-weight="800" fill="#14151A">Main-d'œuvre</text><text x="48" y="187" font-size="13" fill="#6C6A66">Avancement validé : 55 %</text>
  <rect x="270" y="148" width="470.1" height="20" rx="6" fill="#EDEBFF" stroke="#14151A" stroke-width="1.5"/><text x="750.1" y="163" font-size="12.5" fill="#6C6A66">24 035 €</text>
  <rect x="270" y="176" width="535.1" height="20" rx="6" fill="#14151A"/><text x="815.1" y="191" font-size="12.5" font-weight="700" fill="#14151A">27 360 €</text>
  <text x="1152" y="180" font-size="22" font-weight="800" fill="#E5484D" text-anchor="end">−3 325 €</text>
  <path d="M48 212 H1152" stroke="#E4E2DD"/>
  <text x="48" y="246" font-size="17" font-weight="800" fill="#14151A">Matériaux</text><text x="48" y="267" font-size="13" fill="#6C6A66">Avancement validé : 60 %</text>
  <rect x="270" y="228" width="610.2" height="20" rx="6" fill="#EDEBFF" stroke="#14151A" stroke-width="1.5"/><text x="890.2" y="243" font-size="12.5" fill="#6C6A66">31 200 €</text>
  <rect x="270" y="256" width="485.0" height="20" rx="6" fill="#14151A"/><rect x="749.0" y="256" width="141.0" height="20" rx="6" fill="#FFC64D" stroke="#14151A" stroke-width="1.5"/><rect x="749.0" y="256" width="6" height="20" fill="#14151A"/><text x="900.0" y="271" font-size="12.5" font-weight="700" fill="#14151A">31 700 €</text>
  <text x="1152" y="260" font-size="18" font-weight="800" fill="#14151A" text-anchor="end">−500 €</text>
  <path d="M48 292 H1152" stroke="#E4E2DD"/>
  <text x="48" y="326" font-size="17" font-weight="800" fill="#14151A">Matériel</text><text x="48" y="347" font-size="13" fill="#6C6A66">Avancement validé : 55 %</text>
  <rect x="270" y="308" width="102.2" height="20" rx="6" fill="#EDEBFF" stroke="#14151A" stroke-width="1.5"/><text x="382.2" y="323" font-size="12.5" fill="#6C6A66">5 225 €</text>
  <rect x="270" y="336" width="80.2" height="20" rx="6" fill="#14151A"/><rect x="344.2" y="336" width="35.3" height="20" rx="6" fill="#FFC64D" stroke="#14151A" stroke-width="1.5"/><rect x="344.2" y="336" width="6" height="20" fill="#14151A"/><text x="389.5" y="351" font-size="12.5" font-weight="700" fill="#14151A">5 600 €</text>
  <text x="1152" y="340" font-size="18" font-weight="800" fill="#14151A" text-anchor="end">−375 €</text>
  <path d="M48 372 H1152" stroke="#E4E2DD"/>
  <text x="48" y="406" font-size="17" font-weight="800" fill="#14151A">Sous-traitance</text><text x="48" y="427" font-size="13" fill="#6C6A66">Avancement validé : 100 %</text>
  <rect x="270" y="388" width="273.8" height="20" rx="6" fill="#EDEBFF" stroke="#14151A" stroke-width="1.5"/><text x="553.8" y="403" font-size="12.5" fill="#6C6A66">14 000 €</text>
  <rect x="270" y="416" width="273.8" height="20" rx="6" fill="#14151A"/><text x="553.8" y="431" font-size="12.5" font-weight="700" fill="#14151A">14 000 €</text>
  <text x="1152" y="420" font-size="18" font-weight="800" fill="#14151A" text-anchor="end">0 €</text>
  <path d="M48 452 H1152" stroke="#E4E2DD"/>
  <text x="48" y="486" font-size="17" font-weight="800" fill="#14151A">Frais de chantier</text><text x="48" y="507" font-size="13" fill="#6C6A66">Avancement validé : 55 %</text>
  <rect x="270" y="468" width="83.9" height="20" rx="6" fill="#EDEBFF" stroke="#14151A" stroke-width="1.5"/><text x="363.9" y="483" font-size="12.5" fill="#6C6A66">4 290 €</text>
  <rect x="270" y="496" width="90.0" height="20" rx="6" fill="#14151A"/><text x="370.0" y="511" font-size="12.5" font-weight="700" fill="#14151A">4 600 €</text>
  <text x="1152" y="500" font-size="18" font-weight="800" fill="#14151A" text-anchor="end">−310 €</text>
  <g transform="translate(48 548)" font-size="13" fill="#14151A">
    <rect width="16" height="14" rx="4" fill="#EDEBFF" stroke="#14151A" stroke-width="1.5"/><text x="24" y="12">Budget acquis (budget × avancement)</text>
    <rect x="290" width="16" height="14" rx="4" fill="#14151A"/><text x="314" y="12">Facturé</text>
    <rect x="390" width="16" height="14" rx="4" fill="#FFC64D" stroke="#14151A" stroke-width="1.5"/><text x="414" y="12">Engagé, non facturé</text>
  </g>
  <text x="48" y="608" font-size="14.5" font-weight="600" fill="#14151A">Au total : 78 750 € de budget acquis pour 83 260 € de coût réel, soit −4 510 €.</text>
  <text x="1152" y="608" font-size="13" fill="#6C6A66" text-anchor="end">Chiffres fictifs.</text>
