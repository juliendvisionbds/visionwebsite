<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Deux conventions de calcul pour les mêmes taux : en cascade sur le coût, coefficient 1,31 et prix de vente 66,91 € ; sur le prix de vente, coefficient 1,39 et prix de vente 71,13 € (exemple fictif)</title>
  <rect width="1200" height="640" rx="28" fill="#FAF9F6"/>

  <text x="48" y="66" font-size="14" font-weight="700" letter-spacing="2" fill="#5A4BFF">LE PIÈGE DE LA CONVENTION DE CALCUL</text>
  <text x="48" y="100" font-size="26" font-weight="800" fill="#14151A">Mêmes taux affichés, deux prix de vente</text>
  <g transform="translate(48 136)">
    <rect x="8" y="8" width="484" height="400" rx="20" fill="#EDEBFF"/>
    <rect width="484" height="400" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <text x="28" y="42" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#5A4BFF">CONVENTION A</text>
    <text x="28" y="76" font-size="23" font-weight="800" fill="#14151A">En cascade, sur le coût</text>
    <text x="28" y="102" font-size="14" fill="#6C6A66">Chaque taux s'applique sur l'étape précédente.</text>
    <g font-size="14">
      <rect x="28" y="124" width="132" height="34" rx="10" fill="#FFC64D" opacity=".55"/><text x="94" y="146" font-weight="700" fill="#14151A" text-anchor="middle">Chantier 8 %</text>
      <rect x="170" y="124" width="150" height="34" rx="10" fill="#FF8A7A" opacity=".55"/><text x="245" y="146" font-weight="700" fill="#14151A" text-anchor="middle">Généraux 12 %</text>
      <rect x="330" y="124" width="126" height="34" rx="10" fill="#25D3A4" opacity=".55"/><text x="393" y="146" font-weight="700" fill="#14151A" text-anchor="middle">Bénéfice 8 %</text>
    </g>
    <path d="M28 182 H456" stroke="#E4E2DD"/>
    <text x="28" y="212" font-size="11" font-weight="700" letter-spacing="1.2" fill="#6C6A66">CALCUL</text>
    <text x="28" y="240" font-size="18" font-weight="700" fill="#14151A">51,21 × 1,08 × 1,12 × 1,08</text>
    <text x="28" y="290" font-size="11" font-weight="700" letter-spacing="1.2" fill="#6C6A66">COEFFICIENT DE VENTE</text>
    <text x="28" y="350" font-size="52" font-weight="800" fill="#14151A">1,31</text>
    <text x="456" y="290" font-size="11" font-weight="700" letter-spacing="1.2" fill="#6C6A66" text-anchor="end">PRIX DE VENTE HT / M²</text>
    <text x="456" y="350" font-size="52" font-weight="800" fill="#5A4BFF" text-anchor="end">66,91 €</text>
    <text x="28" y="380" font-size="13" fill="#6C6A66">Déboursé sec de départ : 51,21 €</text>
  </g>
  <g transform="translate(668 136)">
    <rect x="8" y="8" width="484" height="400" rx="20" fill="#EDEBFF"/>
    <rect width="484" height="400" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <text x="28" y="42" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#5A4BFF">CONVENTION B</text>
    <text x="28" y="76" font-size="23" font-weight="800" fill="#14151A">Sur le prix de vente</text>
    <text x="28" y="102" font-size="14" fill="#6C6A66">Les taux s'additionnent : 8 + 12 + 8 = 28 % du prix.</text>
    <g font-size="14">
      <rect x="28" y="124" width="132" height="34" rx="10" fill="#FFC64D" opacity=".55"/><text x="94" y="146" font-weight="700" fill="#14151A" text-anchor="middle">Chantier 8 %</text>
      <rect x="170" y="124" width="150" height="34" rx="10" fill="#FF8A7A" opacity=".55"/><text x="245" y="146" font-weight="700" fill="#14151A" text-anchor="middle">Généraux 12 %</text>
      <rect x="330" y="124" width="126" height="34" rx="10" fill="#25D3A4" opacity=".55"/><text x="393" y="146" font-weight="700" fill="#14151A" text-anchor="middle">Bénéfice 8 %</text>
    </g>
    <path d="M28 182 H456" stroke="#E4E2DD"/>
    <text x="28" y="212" font-size="11" font-weight="700" letter-spacing="1.2" fill="#6C6A66">CALCUL</text>
    <text x="28" y="240" font-size="18" font-weight="700" fill="#14151A">51,21 ÷ (1 − 0,28)</text>
    <text x="28" y="290" font-size="11" font-weight="700" letter-spacing="1.2" fill="#6C6A66">COEFFICIENT DE VENTE</text>
    <text x="28" y="350" font-size="52" font-weight="800" fill="#14151A">1,39</text>
    <text x="456" y="290" font-size="11" font-weight="700" letter-spacing="1.2" fill="#6C6A66" text-anchor="end">PRIX DE VENTE HT / M²</text>
    <text x="456" y="350" font-size="52" font-weight="800" fill="#5A4BFF" text-anchor="end">71,13 €</text>
    <text x="28" y="380" font-size="13" fill="#6C6A66">Déboursé sec de départ : 51,21 €</text>
  </g>
  <g transform="translate(600 336)">
    <circle r="52" fill="#14151A"/>
    <text y="-2" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">+ 6 %</text>
    <text y="20" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" opacity=".8">d'écart</text>
  </g>
  <g transform="translate(48 566)">
    <rect width="1104" height="48" rx="16" fill="#14151A"/>
    <text x="552" y="30" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Aucune des deux n'est fausse. Ce qui est faux, c'est de les mélanger dans la même base. Exemple fictif.</text>
  </g>
</svg>
