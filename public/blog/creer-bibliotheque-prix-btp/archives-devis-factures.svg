<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Où sont vos prix aujourd'hui : factures fournisseurs, devis acceptés, DPGF et BPU, fichiers personnels, devis refusés</title>
  <rect width="1200" height="640" rx="28" fill="#FAF9F6"/>

  <text x="48" y="66" font-size="14" font-weight="700" letter-spacing="2" fill="#5A4BFF">ÉTAPE 1 · L'INVENTAIRE</text>
  <text x="48" y="100" font-size="26" font-weight="800" fill="#14151A">Où sont vos prix aujourd'hui ?</text>
  <g transform="translate(48 136)">
    <rect x="7" y="7" width="208" height="380" rx="20" fill="#EDEBFF"/>
    <rect width="208" height="380" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <rect x="20" y="22" width="52" height="40" rx="10" fill="#E5484D"/><text x="46" y="47" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">PDF</text>
    <text x="20" y="98" font-size="21" font-weight="800" fill="#14151A">Factures</text><text x="20" y="124" font-size="21" font-weight="800" fill="#14151A">fournisseurs</text>
    <text x="20" y="162" font-size="11" font-weight="700" letter-spacing="1.2" fill="#6C6A66">OÙ CHERCHER</text><text x="20" y="184" font-size="13.5" fill="#14151A">Comptabilité, boîte mail,</text><text x="20" y="203" font-size="13.5" fill="#14151A">GED</text>
    <path d="M20 224 H188" stroke="#E4E2DD"/>
