    <text x="20" y="162" font-size="11" font-weight="700" letter-spacing="1.2" fill="#6C6A66">OÙ CHERCHER</text><text x="20" y="184" font-size="13.5" fill="#14151A">Dossiers de réponse</text><text x="20" y="203" font-size="13.5" fill="#14151A"></text>
    <path d="M20 224 H188" stroke="#E4E2DD"/>
