    <text x="20" y="318" font-size="11" font-weight="700" letter-spacing="1.2" fill="#6C6A66">CE QU’ON Y TROUVE</text>
    <rect x="20" y="330" width="113" height="24" rx="12" fill="#EDEBFF"/><text x="76.5" y="346.5" font-size="12" font-weight="700" fill="#5A4BFF" text-anchor="middle">Prix d'achat</text>
  </g>
  <g transform="translate(272 136)">
    <rect x="7" y="7" width="208" height="380" rx="20" fill="#EDEBFF"/>
    <rect width="208" height="380" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <rect x="20" y="22" width="52" height="40" rx="10" fill="#5A4BFF"/><text x="46" y="47" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">DEV</text>
    <text x="20" y="98" font-size="21" font-weight="800" fill="#14151A">Devis</text><text x="20" y="124" font-size="21" font-weight="800" fill="#14151A">acceptés</text>
    <text x="20" y="162" font-size="11" font-weight="700" letter-spacing="1.2" fill="#6C6A66">OÙ CHERCHER</text><text x="20" y="184" font-size="13.5" fill="#14151A">Logiciel de devis, Excel,</text><text x="20" y="203" font-size="13.5" fill="#14151A">Word, PDF</text>
    <path d="M20 224 H188" stroke="#E4E2DD"/>
