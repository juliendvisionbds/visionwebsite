  <g transform="translate(48 552)">
    <rect width="1104" height="54" rx="16" fill="#14151A"/>
    <text x="552" y="33" font-size="15.5" font-weight="600" fill="#fff" text-anchor="middle">Deux à trois ans d'historique suffisent. Commencez par les 30 à 50 ouvrages que vous chiffrez le plus.</text>
