<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Situation de travaux n° 3 : avancement cumulé par poste, trois postes et un avenant qui changent ce mois-ci, puis le calcul jusqu'au net à payer de 60 648 € (exemple fictif)</title>
  <rect width="1200" height="640" rx="28" fill="#FAF9F6"/>

  <text x="48" y="66" font-size="14" font-weight="700" letter-spacing="2" fill="#5A4BFF">SITUATION N° 3 · MARCHÉ DE 180 000 € HT + AVENANT</text>
  <text x="48" y="100" font-size="26" font-weight="800" fill="#14151A">Ce qui change ce mois-ci, et le calcul qui en découle</text>
  <g transform="translate(48 136)">
    <rect x="7" y="7" width="620" height="440" rx="20" fill="#EDEBFF"/>
    <rect width="620" height="440" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <text x="24" y="38" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#5A4BFF">AVANCEMENT CUMULÉ PAR POSTE</text>
    <text x="596" y="38" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#6C6A66" text-anchor="end">S2 → S3</text>
    <path d="M0 56 H620" stroke="#14151A" stroke-width="2"/>
    <text x="24" y="86" font-size="14.5" font-weight="500" fill="#6C6A66">Installation de chantier</text>
    <rect x="236" y="73" width="220" height="16" rx="8" fill="#F1EFEA"/><clipPath id="r0"><rect x="236" y="73" width="220" height="16" rx="8"/></clipPath><g clip-path="url(#r0)"><rect x="236" y="73" width="220.0" height="16" fill="#C9C5BD"/><rect x="236" y="73" width="220.0" height="16" fill="#C9C5BD"/></g><text x="596" y="86" font-size="14" font-weight="500" fill="#6C6A66" text-anchor="end">100 %</text>
    <path d="M0 106 H620" stroke="#E4E2DD"/>
    <text x="24" y="136" font-size="14.5" font-weight="500" fill="#6C6A66">Terrassement</text>
    <rect x="236" y="123" width="220" height="16" rx="8" fill="#F1EFEA"/><clipPath id="r1"><rect x="236" y="123" width="220" height="16" rx="8"/></clipPath><g clip-path="url(#r1)"><rect x="236" y="123" width="220.0" height="16" fill="#C9C5BD"/><rect x="236" y="123" width="220.0" height="16" fill="#C9C5BD"/></g><text x="596" y="136" font-size="14" font-weight="500" fill="#6C6A66" text-anchor="end">100 %</text>
    <path d="M0 156 H620" stroke="#E4E2DD"/>
    <text x="24" y="186" font-size="14.5" font-weight="700" fill="#14151A">Fondations</text>
    <rect x="236" y="173" width="220" height="16" rx="8" fill="#F1EFEA"/><clipPath id="r2"><rect x="236" y="173" width="220" height="16" rx="8"/></clipPath><g clip-path="url(#r2)"><rect x="236" y="173" width="220.0" height="16" fill="#5A4BFF"/><rect x="236" y="173" width="176.0" height="16" fill="#B9B2FF"/></g><text x="596" y="186" font-size="14" font-weight="800" fill="#14151A" text-anchor="end">80 → 100 %</text>
    <path d="M0 206 H620" stroke="#E4E2DD"/>
    <text x="24" y="236" font-size="14.5" font-weight="700" fill="#14151A">Maçonnerie en élévation</text>
    <rect x="236" y="223" width="220" height="16" rx="8" fill="#F1EFEA"/><clipPath id="r3"><rect x="236" y="223" width="220" height="16" rx="8"/></clipPath><g clip-path="url(#r3)"><rect x="236" y="223" width="121.0" height="16" fill="#5A4BFF"/><rect x="236" y="223" width="33.0" height="16" fill="#B9B2FF"/></g><text x="596" y="236" font-size="14" font-weight="800" fill="#14151A" text-anchor="end">15 → 55 %</text>
    <path d="M0 256 H620" stroke="#E4E2DD"/>
    <text x="24" y="286" font-size="14.5" font-weight="700" fill="#14151A">Dalles et planchers</text>
    <rect x="236" y="273" width="220" height="16" rx="8" fill="#F1EFEA"/><clipPath id="r4"><rect x="236" y="273" width="220" height="16" rx="8"/></clipPath><g clip-path="url(#r4)"><rect x="236" y="273" width="88.0" height="16" fill="#5A4BFF"/></g><text x="596" y="286" font-size="14" font-weight="800" fill="#14151A" text-anchor="end">0 → 40 %</text>
    <path d="M0 306 H620" stroke="#E4E2DD"/>
    <text x="24" y="336" font-size="14.5" font-weight="500" fill="#6C6A66">Divers et finitions</text>
    <rect x="236" y="323" width="220" height="16" rx="8" fill="#F1EFEA"/><text x="596" y="336" font-size="14" font-weight="500" fill="#6C6A66" text-anchor="end">0 %</text>
    <path d="M0 356 H620" stroke="#E4E2DD"/>
    <text x="24" y="386" font-size="14.5" font-weight="700" fill="#14151A">Avenant n° 1 : muret</text>
    <rect x="236" y="373" width="220" height="16" rx="8" fill="#F1EFEA"/><clipPath id="r6"><rect x="236" y="373" width="220" height="16" rx="8"/></clipPath><g clip-path="url(#r6)"><rect x="236" y="373" width="220.0" height="16" fill="#5A4BFF"/></g><text x="596" y="386" font-size="14" font-weight="800" fill="#14151A" text-anchor="end">Signé · 100 %</text>
    <g transform="translate(24 418)" font-size="12.5" fill="#6C6A66">
      <rect width="14" height="10" rx="3" fill="#B9B2FF"/><text x="20" y="9.5">Déjà facturé (S2)</text>
      <rect x="150" width="14" height="10" rx="3" fill="#5A4BFF"/><text x="170" y="9.5">Ce mois-ci</text>
      <rect x="270" width="14" height="10" rx="3" fill="#C9C5BD"/><text x="290" y="9.5">Sans changement</text>
    </g>
  </g>
  <g transform="translate(700 136)">
    <rect width="452" height="440" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <text x="24" y="38" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#5A4BFF">DU CUMUL AU NET À PAYER</text>
    <path d="M0 56 H452" stroke="#14151A" stroke-width="2"/>
    <text x="24" y="88" font-size="15" font-weight="500" fill="#6C6A66">Cumul HT à fin de S3</text><text x="428" y="88" font-size="15" font-weight="600" fill="#14151A" text-anchor="end">121 200 €</text>
    <path d="M24 106 H428" stroke="#E4E2DD"/>
    <text x="24" y="138" font-size="15" font-weight="500" fill="#6C6A66">− Cumul HT à fin de S2</text><text x="428" y="138" font-size="15" font-weight="600" fill="#14151A" text-anchor="end">68 000 €</text>
    <path d="M24 156 H428" stroke="#E4E2DD"/>
    <text x="24" y="188" font-size="15" font-weight="800" fill="#14151A">= Situation n° 3 HT</text><text x="428" y="188" font-size="17" font-weight="800" fill="#14151A" text-anchor="end">53 200 €</text>
    <path d="M24 206 H428" stroke="#E4E2DD"/>
    <text x="24" y="238" font-size="15" font-weight="500" fill="#6C6A66">+ TVA 20 %</text><text x="428" y="238" font-size="15" font-weight="600" fill="#14151A" text-anchor="end">10 640 €</text>
    <path d="M24 256 H428" stroke="#E4E2DD"/>
    <text x="24" y="288" font-size="15" font-weight="800" fill="#14151A">= Montant TTC</text><text x="428" y="288" font-size="17" font-weight="800" fill="#14151A" text-anchor="end">63 840 €</text>
    <path d="M24 306 H428" stroke="#E4E2DD"/>
    <text x="24" y="338" font-size="15" font-weight="500" fill="#6C6A66">− Retenue de garantie 5 %</text><text x="428" y="338" font-size="15" font-weight="600" fill="#14151A" text-anchor="end">3 192 €</text>
    <rect x="16" y="370" width="420" height="72" rx="14" fill="#14151A"/>
    <text x="36" y="412" font-size="17" font-weight="800" fill="#fff">Net à payer</text>
    <text x="416" y="416" font-size="30" font-weight="800" fill="#FFC64D" text-anchor="end">60 648 €</text>
  </g>
  <text x="48" y="616" font-size="13" fill="#6C6A66">Retenue calculée ici sur le TTC : les modalités dépendent de votre contrat. Exemple fictif.</text>
</svg>
