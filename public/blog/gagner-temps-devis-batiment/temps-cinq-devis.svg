<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Répartition du temps sur cinq devis : 37 % de recherche de prix, 25 % de ressaisie, 38 % pour le reste ; 12 jours d'attente sur 34 jours de délai (chiffres fictifs)</title>
  <rect width="1200" height="640" rx="28" fill="#FAF9F6"/>

  <text x="48" y="66" font-size="14" font-weight="700" letter-spacing="2" fill="#5A4BFF">ÉTAPE 2 · LA MESURE</text>
  <text x="48" y="100" font-size="26" font-weight="800" fill="#14151A">Cinq devis : où est passé le temps ?</text>

  <!-- temps de travail -->
  <g transform="translate(48 136)">
    <rect x="8" y="8" width="1104" height="212" rx="20" fill="#EDEBFF"/>
    <rect width="1104" height="212" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <text x="28" y="40" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#6C6A66">TEMPS DE TRAVAIL</text>
    <text x="1076" y="44" font-size="24" font-weight="800" fill="#14151A" text-anchor="end">22 h 05</text>
    <clipPath id="b1"><rect x="28" y="64" width="1048" height="56" rx="14"/></clipPath>
    <g clip-path="url(#b1)">
      <rect x="28.0" y="64" width="387.8" height="56" fill="#FFC64D"/>
      <rect x="415.8" y="64" width="256.8" height="56" fill="#FF8A7A"/>
      <rect x="672.5" y="64" width="403.5" height="56" fill="#EDEBFF"/>
    </g>
    <rect x="28" y="64" width="1048" height="56" rx="14" fill="none" stroke="#14151A" stroke-width="2"/>
    <text x="44.0" y="99" font-size="17" font-weight="800" fill="#14151A">8 h 10 · 37 %</text>
    <rect x="28.0" y="146" width="14" height="14" rx="4" fill="#FFC64D" stroke="#14151A" stroke-width="1.5"/><text x="50.0" y="158" font-size="14.5" font-weight="700" fill="#14151A">Recherche de prix</text>
    <path d="M415.8 64 v56" stroke="#14151A" stroke-width="2"/>
    <text x="431.8" y="99" font-size="17" font-weight="800" fill="#14151A">5 h 25 · 25 %</text>
    <rect x="415.8" y="146" width="14" height="14" rx="4" fill="#FF8A7A" stroke="#14151A" stroke-width="1.5"/><text x="437.8" y="158" font-size="14.5" font-weight="700" fill="#14151A">Ressaisie, mise en forme</text>
    <path d="M672.5 64 v56" stroke="#14151A" stroke-width="2"/>
    <text x="688.5" y="99" font-size="17" font-weight="800" fill="#14151A">8 h 30 · 38 %</text>
    <rect x="672.5" y="146" width="14" height="14" rx="4" fill="#EDEBFF" stroke="#14151A" stroke-width="1.5"/><text x="694.5" y="158" font-size="14.5" font-weight="700" fill="#14151A">Lecture, visite, lignes, vérification, décision</text>
    <text x="28" y="190" font-size="13.5" fill="#6C6A66">Plus de 6 heures sur 10 passent à retrouver des prix et à recopier.</text>
  </g>

  <!-- délai -->
  <g transform="translate(48 372)">
    <rect x="8" y="8" width="1104" height="212" rx="20" fill="#EDEBFF"/>
    <rect width="1104" height="212" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <text x="28" y="40" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#6C6A66">DÉLAI ENTRE LA DEMANDE ET L'ENVOI</text>
    <text x="1076" y="44" font-size="24" font-weight="800" fill="#14151A" text-anchor="end">34 jours</text>
    <clipPath id="b2"><rect x="28" y="64" width="1048" height="56" rx="14"/></clipPath>
    <g clip-path="url(#b2)">
      <rect x="28" y="64" width="369.9" height="56" fill="#D8D5CE"/>
      <rect x="397.9" y="64" width="678.1" height="56" fill="#fff"/>
    </g>
    <rect x="28" y="64" width="1048" height="56" rx="14" fill="none" stroke="#14151A" stroke-width="2"/>
    <path d="M397.9 64 v56" stroke="#14151A" stroke-width="2"/>
    <text x="44" y="99" font-size="17" font-weight="800" fill="#14151A">12 jours</text>
    <text x="413.9" y="99" font-size="17" font-weight="800" fill="#14151A">22 jours</text>
    <rect x="28" y="146" width="14" height="14" rx="4" fill="#D8D5CE" stroke="#14151A" stroke-width="1.5"/><text x="50" y="158" font-size="14.5" font-weight="700" fill="#14151A">Attente d'informations</text>
    <rect x="397.9" y="146" width="14" height="14" rx="4" fill="#fff" stroke="#14151A" stroke-width="1.5"/><text x="419.9" y="158" font-size="14.5" font-weight="700" fill="#14151A">Le reste du délai</text>
    <text x="28" y="190" font-size="13.5" fill="#6C6A66">Un devis peut demander deux heures de travail et partir au bout de douze jours : ce sont deux problèmes différents.</text>
  </g>
  <text x="48" y="622" font-size="13" fill="#6C6A66">Total des cinq devis de l'exemple. Chiffres fictifs.</text>
</svg>
