<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Le parcours d'un devis en huit étapes, de la réception de la demande à l'envoi : attente, recherche de prix, ressaisie, décision</title>
  <rect width="1200" height="640" rx="28" fill="#FAF9F6"/>

  <text x="48" y="66" font-size="14" font-weight="700" letter-spacing="2" fill="#5A4BFF">DE LA DEMANDE À L'ENVOI</text>
  <text x="48" y="100" font-size="26" font-weight="800" fill="#14151A">Le parcours d'un devis, étape par étape</text>
  <g transform="translate(48 136)">
    <rect x="7" y="7" width="264" height="180" rx="20" fill="#EDEBFF"/>
    <rect width="264" height="180" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <circle cx="38" cy="38" r="17" fill="#14151A"/><text x="38" y="43.5" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">1</text>
    <text x="22" y="96" font-size="20" font-weight="800" fill="#14151A">Réception et</text><text x="22" y="121" font-size="20" font-weight="800" fill="#14151A">lecture de la demande</text>
    <text x="22" y="154" font-size="13.5" fill="#6C6A66">Mail, appel, plans, CCTP</text>
  </g>
  <path d="M319 226 h9" stroke="#5A4BFF" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(328 136)">
    <rect x="7" y="7" width="264" height="180" rx="20" fill="#EDEBFF"/>
    <rect width="264" height="180" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <circle cx="38" cy="38" r="17" fill="#14151A"/><text x="38" y="43.5" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">2</text>
    <text x="22" y="96" font-size="20" font-weight="800" fill="#14151A">Visite</text><text x="22" y="121" font-size="20" font-weight="800" fill="#14151A">ou relevés</text>
    <text x="22" y="154" font-size="13.5" fill="#6C6A66">Déplacement, métré, photos</text>
  </g>
  <path d="M599 226 h9" stroke="#5A4BFF" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(608 136)">
    <rect x="7" y="7" width="264" height="180" rx="20" fill="#EDEBFF"/>
    <rect width="264" height="180" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <circle cx="38" cy="38" r="17" fill="#14151A"/><text x="38" y="43.5" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">3</text>
    <rect x="153" y="26" width="91" height="24" rx="12" fill="#ECEAE5"/><text x="198.5" y="42.5" font-size="12" font-weight="700" fill="#55534F" text-anchor="middle">On attend</text>
    <text x="22" y="96" font-size="20" font-weight="800" fill="#14151A">Questions</text><text x="22" y="121" font-size="20" font-weight="800" fill="#14151A">et compléments</text>
    <text x="22" y="154" font-size="13.5" fill="#6C6A66">Infos manquantes à demander</text>
  </g>
  <path d="M879 226 h9" stroke="#5A4BFF" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(888 136)">
    <rect x="7" y="7" width="264" height="180" rx="20" fill="#EDEBFF"/>
    <rect width="264" height="180" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <circle cx="38" cy="38" r="17" fill="#14151A"/><text x="38" y="43.5" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">4</text>
    <rect x="146" y="26" width="98" height="24" rx="12" fill="#FFF1D0"/><text x="195.0" y="42.5" font-size="12" font-weight="700" fill="#8A5A00" text-anchor="middle">On cherche</text>
    <text x="22" y="96" font-size="20" font-weight="800" fill="#14151A">Recherche</text><text x="22" y="121" font-size="20" font-weight="800" fill="#14151A">de prix</text>
    <text x="22" y="154" font-size="13.5" fill="#6C6A66">Anciens devis, factures</text>
  </g>
  <g transform="translate(48 340)">
    <rect x="7" y="7" width="264" height="180" rx="20" fill="#EDEBFF"/>
    <rect width="264" height="180" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <circle cx="38" cy="38" r="17" fill="#14151A"/><text x="38" y="43.5" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">5</text>
    <text x="22" y="96" font-size="20" font-weight="800" fill="#14151A">Montage</text><text x="22" y="121" font-size="20" font-weight="800" fill="#14151A">des lignes</text>
    <text x="22" y="154" font-size="13.5" fill="#6C6A66">Quantités, ouvrages, libellés</text>
  </g>
  <path d="M319 430 h9" stroke="#5A4BFF" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(328 340)">
    <rect x="7" y="7" width="264" height="180" rx="20" fill="#EDEBFF"/>
    <rect width="264" height="180" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <circle cx="38" cy="38" r="17" fill="#14151A"/><text x="38" y="43.5" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">6</text>
    <rect x="146" y="26" width="98" height="24" rx="12" fill="#FFE3E0"/><text x="195.0" y="42.5" font-size="12" font-weight="700" fill="#B3261E" text-anchor="middle">On recopie</text>
    <text x="22" y="96" font-size="20" font-weight="800" fill="#14151A">Ressaisie et</text><text x="22" y="121" font-size="20" font-weight="800" fill="#14151A">mise en forme</text>
    <text x="22" y="154" font-size="13.5" fill="#6C6A66">Report dans le logiciel</text>
  </g>
  <path d="M599 430 h9" stroke="#5A4BFF" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(608 340)">
    <rect x="7" y="7" width="264" height="180" rx="20" fill="#EDEBFF"/>
    <rect width="264" height="180" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <circle cx="38" cy="38" r="17" fill="#5A4BFF"/><text x="38" y="43.5" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">7</text>
    <rect x="153" y="26" width="91" height="24" rx="12" fill="#5A4BFF"/><text x="198.5" y="42.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">On décide</text>
    <text x="22" y="96" font-size="20" font-weight="800" fill="#14151A">Vérification</text><text x="22" y="121" font-size="20" font-weight="800" fill="#14151A">et arbitrage</text>
    <text x="22" y="154" font-size="13.5" fill="#6C6A66">Relecture, marge, validation</text>
  </g>
  <path d="M879 430 h9" stroke="#5A4BFF" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(888 340)">
    <rect x="7" y="7" width="264" height="180" rx="20" fill="#EDEBFF"/>
    <rect width="264" height="180" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <circle cx="38" cy="38" r="17" fill="#14151A"/><text x="38" y="43.5" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">8</text>
    <text x="22" y="96" font-size="20" font-weight="800" fill="#14151A">Envoi</text><text x="22" y="121" font-size="20" font-weight="800" fill="#14151A"></text>
    <text x="22" y="154" font-size="13.5" fill="#6C6A66">Le devis part chez le client</text>
  </g>
  <g transform="translate(48 552)">
    <rect width="1104" height="54" rx="16" fill="#14151A"/>
    <text x="552" y="33" font-size="15.5" font-weight="600" fill="#fff" text-anchor="middle">Attendre, chercher, recopier : c'est là que part le temps. Seule la décision a vraiment besoin de vous.</text>
  </g>
</svg>
