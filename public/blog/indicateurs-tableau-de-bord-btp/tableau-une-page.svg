    <text x="22" y="122" font-size="40" font-weight="800" fill="#14151A">74 k€</text>
    <path d="M22 142 H336" stroke="#E4E2DD"/>
    <text x="22" y="168" font-size="13" fill="#6C6A66">Mois précédent : <tspan font-weight="700" fill="#14151A">58 k€</tspan></text><text x="336" y="168" font-size="13" fill="#6C6A66" text-anchor="end">Seuil : <tspan font-weight="700" fill="#14151A">&lt; 50 k€</tspan></text>
  </g>
  <g transform="translate(794 352)">
    <rect x="7" y="7" width="358" height="192" rx="20" fill="#EDEBFF"/>
    <rect width="358" height="192" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <text x="22" y="36" font-size="11" font-weight="700" letter-spacing="1.3" fill="#5A4BFF">TRÉSORERIE</text>
    <rect x="207" y="18" width="129" height="26" rx="13" fill="#E3F9F2"/><circle cx="222" cy="31" r="5.5" fill="#25D3A4"/><text x="234" y="35.5" font-size="12" font-weight="700" fill="#14151A">Dans le seuil</text>
    <text x="22" y="68" font-size="15.5" font-weight="700" fill="#14151A">Trésorerie prév. à 10 semaines</text>
    <text x="22" y="122" font-size="40" font-weight="800" fill="#14151A">310 k€</text>
    <path d="M22 142 H336" stroke="#E4E2DD"/>
    <text x="22" y="168" font-size="13" fill="#6C6A66">Mois précédent : <tspan font-weight="700" fill="#14151A">290 k€</tspan></text><text x="336" y="168" font-size="13" fill="#6C6A66" text-anchor="end">Seuil : <tspan font-weight="700" fill="#14151A">&gt; 200 k€</tspan></text>
