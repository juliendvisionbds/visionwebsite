    <text x="22" y="36" font-size="11" font-weight="700" letter-spacing="1.3" fill="#5A4BFF">COMMERCIAL</text>
    <rect x="207" y="18" width="129" height="26" rx="13" fill="#E3F9F2"/><circle cx="222" cy="31" r="5.5" fill="#25D3A4"/><text x="234" y="35.5" font-size="12" font-weight="700" fill="#14151A">Dans le seuil</text>
    <text x="22" y="68" font-size="15.5" font-weight="700" fill="#14151A">Taux de transformation</text>
    <text x="22" y="122" font-size="40" font-weight="800" fill="#14151A">28 %</text>
