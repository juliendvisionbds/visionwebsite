<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Tableau de bord dirigeant d'une page : six indicateurs avec leur valeur, le mois précédent, leur seuil et leur statut (chiffres fictifs)</title>
  <rect width="1200" height="640" rx="28" fill="#FAF9F6"/>

  <text x="48" y="66" font-size="14" font-weight="700" letter-spacing="2" fill="#5A4BFF">TABLEAU DE BORD DIRIGEANT · REVUE MENSUELLE</text>
  <text x="48" y="100" font-size="26" font-weight="800" fill="#14151A">Six chiffres, une page, deux sujets à traiter</text>
  <g transform="translate(48 136)">
    <rect x="7" y="7" width="358" height="192" rx="20" fill="#EDEBFF"/>
    <rect width="358" height="192" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <text x="22" y="36" font-size="11" font-weight="700" letter-spacing="1.3" fill="#5A4BFF">COMMERCIAL</text>
    <rect x="207" y="18" width="129" height="26" rx="13" fill="#E3F9F2"/><circle cx="222" cy="31" r="5.5" fill="#25D3A4"/><text x="234" y="35.5" font-size="12" font-weight="700" fill="#14151A">Dans le seuil</text>
