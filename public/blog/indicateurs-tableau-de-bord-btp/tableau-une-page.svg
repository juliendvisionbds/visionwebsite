    <rect x="256" y="18" width="80" height="26" rx="13" fill="#FFE3E0"/><circle cx="271" cy="31" r="5.5" fill="#E5484D"/><text x="283" y="35.5" font-size="12" font-weight="700" fill="#B3261E">Alerte</text>
