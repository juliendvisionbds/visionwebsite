    <text x="22" y="122" font-size="40" font-weight="800" fill="#14151A">4,2 mois</text>
    <path d="M22 142 H336" stroke="#E4E2DD"/>
    <text x="22" y="168" font-size="13" fill="#6C6A66">Mois précédent : <tspan font-weight="700" fill="#14151A">4,6 mois</tspan></text><text x="336" y="168" font-size="13" fill="#6C6A66" text-anchor="end">Seuil : <tspan font-weight="700" fill="#14151A">&gt; 3 mois</tspan></text>
  </g>
  <g transform="translate(421 136)">
