    <text x="22" y="122" font-size="40" font-weight="800" fill="#14151A">2 sur 12</text>
    <path d="M22 142 H336" stroke="#E4E2DD"/>
    <text x="22" y="168" font-size="13" fill="#6C6A66">Mois précédent : <tspan font-weight="700" fill="#14151A">1 sur 11</tspan></text><text x="336" y="168" font-size="13" fill="#6C6A66" text-anchor="end">Seuil : <tspan font-weight="700" fill="#14151A">0</tspan></text>
  </g>
  <g transform="translate(421 352)">
    <rect x="7" y="7" width="358" height="192" rx="20" fill="#EDEBFF"/>
    <rect width="358" height="192" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
