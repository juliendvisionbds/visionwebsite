    <text x="22" y="122" font-size="40" font-weight="800" fill="#14151A">186 k€</text>
    <path d="M22 142 H336" stroke="#E4E2DD"/>
    <text x="22" y="168" font-size="13" fill="#6C6A66">Mois précédent : <tspan font-weight="700" fill="#14151A">142 k€</tspan></text><text x="336" y="168" font-size="13" fill="#6C6A66" text-anchor="end">Seuil : <tspan font-weight="700" fill="#14151A">&lt; 150 k€</tspan></text>
  </g>
  <g transform="translate(48 352)">
    <rect x="7" y="7" width="358" height="192" rx="20" fill="#EDEBFF"/>
    <rect width="358" height="192" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
