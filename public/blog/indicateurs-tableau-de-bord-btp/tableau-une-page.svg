  <text x="48" y="606" font-size="14.5" font-weight="600" fill="#14151A">À traiter ce mois-ci : émettre les situations en retard, relancer les encours, voir deux chantiers avec leurs conducteurs.</text>
  <text x="1152" y="606" font-size="13" fill="#6C6A66" text-anchor="end">Chiffres fictifs.</text>
