<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Les quatre familles d'indicateurs d'un tableau de bord BTP : commercial, production, marge, trésorerie</title>
  <rect width="1200" height="640" rx="28" fill="#FAF9F6"/>

  <text x="48" y="66" font-size="14" font-weight="700" letter-spacing="2" fill="#5A4BFF">ÉTAPE 2 · LES INDICATEURS</text>
  <text x="48" y="100" font-size="26" font-weight="800" fill="#14151A">Quatre familles, quatre questions différentes</text>
  <g transform="translate(48 136)">
    <rect x="7" y="7" width="264" height="400" rx="20" fill="#EDEBFF"/>
    <rect width="264" height="400" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <rect x="20" y="22" width="120" height="30" rx="15" fill="#5A4BFF"/><text x="80.0" y="42" font-size="12.5" font-weight="800" letter-spacing="1.3" fill="#fff" text-anchor="middle">COMMERCIAL</text>
    <text x="20" y="92" font-size="18" font-weight="800" fill="#14151A">Ai-je assez de travail</text><text x="20" y="116" font-size="18" font-weight="800" fill="#14151A">pour les mois à venir ?</text>
    <path d="M20 140 H244" stroke="#E4E2DD"/>
    <text x="20" y="168" font-size="11" font-weight="700" letter-spacing="1.2" fill="#6C6A66">INDICATEURS</text>
    <circle cx="25" cy="191" r="4" fill="#5A4BFF"/><text x="38" y="196" font-size="14.5" font-weight="600" fill="#14151A">Devis émis</text>
    <circle cx="25" cy="221" r="4" fill="#5A4BFF"/><text x="38" y="226" font-size="14.5" font-weight="600" fill="#14151A">Taux de transformation</text>
    <circle cx="25" cy="251" r="4" fill="#5A4BFF"/><text x="38" y="256" font-size="14.5" font-weight="600" fill="#14151A">Carnet de commandes</text>
    <circle cx="25" cy="281" r="4" fill="#5A4BFF"/><text x="38" y="286" font-size="14.5" font-weight="600" fill="#14151A">Concentration client</text>
    <path d="M20 326 H244" stroke="#E4E2DD"/>
    <text x="20" y="352" font-size="11" font-weight="700" letter-spacing="1.2" fill="#6C6A66">SOURCES</text><text x="20" y="376" font-size="13.5" fill="#6C6A66">Logiciel de devis, marchés</text>
  </g>
  <g transform="translate(328 136)">
    <rect x="7" y="7" width="264" height="400" rx="20" fill="#EDEBFF"/>
    <rect width="264" height="400" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <rect x="20" y="22" width="120" height="30" rx="15" fill="#FFC64D"/><text x="80.0" y="42" font-size="12.5" font-weight="800" letter-spacing="1.3" fill="#14151A" text-anchor="middle">PRODUCTION</text>
    <text x="20" y="92" font-size="18" font-weight="800" fill="#14151A">Ce qui est produit</text><text x="20" y="116" font-size="18" font-weight="800" fill="#14151A">est-il facturé ?</text>
    <path d="M20 140 H244" stroke="#E4E2DD"/>
    <text x="20" y="168" font-size="11" font-weight="700" letter-spacing="1.2" fill="#6C6A66">INDICATEURS</text>
    <circle cx="25" cy="191" r="4" fill="#5A4BFF"/><text x="38" y="196" font-size="14.5" font-weight="600" fill="#14151A">CA produit vs objectif</text>
    <circle cx="25" cy="221" r="4" fill="#5A4BFF"/><text x="38" y="226" font-size="14.5" font-weight="600" fill="#14151A">Production non facturée</text>
    <circle cx="25" cy="251" r="4" fill="#5A4BFF"/><text x="38" y="256" font-size="14.5" font-weight="600" fill="#14151A">Heures réalisées vs budget</text>
    <path d="M20 326 H244" stroke="#E4E2DD"/>
    <text x="20" y="352" font-size="11" font-weight="700" letter-spacing="1.2" fill="#6C6A66">SOURCES</text><text x="20" y="376" font-size="13.5" fill="#6C6A66">Avancements, pointage</text>
  </g>
  <g transform="translate(608 136)">
    <rect x="7" y="7" width="264" height="400" rx="20" fill="#EDEBFF"/>
    <rect width="264" height="400" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <rect x="20" y="22" width="74" height="30" rx="15" fill="#25D3A4"/><text x="57.0" y="42" font-size="12.5" font-weight="800" letter-spacing="1.3" fill="#14151A" text-anchor="middle">MARGE</text>
    <text x="20" y="92" font-size="18" font-weight="800" fill="#14151A">Quel chantier est</text><text x="20" y="116" font-size="18" font-weight="800" fill="#14151A">en train de déraper ?</text>
    <path d="M20 140 H244" stroke="#E4E2DD"/>
    <text x="20" y="168" font-size="11" font-weight="700" letter-spacing="1.2" fill="#6C6A66">INDICATEURS</text>
    <circle cx="25" cy="191" r="4" fill="#5A4BFF"/><text x="38" y="196" font-size="14.5" font-weight="600" fill="#14151A">Marge à l'avancement</text>
    <circle cx="25" cy="221" r="4" fill="#5A4BFF"/><text x="38" y="226" font-size="14.5" font-weight="600" fill="#14151A">Écart sur déboursé</text>
    <circle cx="25" cy="251" r="4" fill="#5A4BFF"/><text x="38" y="256" font-size="14.5" font-weight="600" fill="#14151A">Travaux supplémentaires</text>
<text x="38" y="277" font-size="14.5" font-weight="600" fill="#14151A">non signés</text>
    <path d="M20 326 H244" stroke="#E4E2DD"/>
    <text x="20" y="352" font-size="11" font-weight="700" letter-spacing="1.2" fill="#6C6A66">SOURCES</text><text x="20" y="376" font-size="13.5" fill="#6C6A66">Budget, achats, heures</text>
  </g>
  <g transform="translate(888 136)">
    <rect x="7" y="7" width="264" height="400" rx="20" fill="#EDEBFF"/>
    <rect width="264" height="400" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <rect x="20" y="22" width="120" height="30" rx="15" fill="#14151A"/><text x="80.0" y="42" font-size="12.5" font-weight="800" letter-spacing="1.3" fill="#fff" text-anchor="middle">TRÉSORERIE</text>
    <text x="20" y="92" font-size="18" font-weight="800" fill="#14151A">Qui me doit de l'argent,</text><text x="20" y="116" font-size="18" font-weight="800" fill="#14151A">et depuis quand ?</text>
    <path d="M20 140 H244" stroke="#E4E2DD"/>
    <text x="20" y="168" font-size="11" font-weight="700" letter-spacing="1.2" fill="#6C6A66">INDICATEURS</text>
    <circle cx="25" cy="191" r="4" fill="#5A4BFF"/><text x="38" y="196" font-size="14.5" font-weight="600" fill="#14151A">Encours clients échus</text>
    <circle cx="25" cy="221" r="4" fill="#5A4BFF"/><text x="38" y="226" font-size="14.5" font-weight="600" fill="#14151A">Délai moyen d'encaissement</text>
    <circle cx="25" cy="251" r="4" fill="#5A4BFF"/><text x="38" y="256" font-size="14.5" font-weight="600" fill="#14151A">Retenues de garantie</text>
    <circle cx="25" cy="281" r="4" fill="#5A4BFF"/><text x="38" y="286" font-size="14.5" font-weight="600" fill="#14151A">Trésorerie prévisionnelle</text>
    <path d="M20 326 H244" stroke="#E4E2DD"/>
    <text x="20" y="352" font-size="11" font-weight="700" letter-spacing="1.2" fill="#6C6A66">SOURCES</text><text x="20" y="376" font-size="13.5" fill="#6C6A66">Comptabilité, banque</text>
  </g>
  <g transform="translate(48 566)">
    <rect width="1104" height="48" rx="16" fill="#14151A"/>
    <text x="552" y="30" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Un chiffre d'affaires en hausse peut cacher une marge qui baisse, et une marge correcte une trésorerie tendue.</text>
  </g>
</svg>
