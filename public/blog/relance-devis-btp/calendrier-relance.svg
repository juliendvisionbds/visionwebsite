<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Calendrier de relance d'un devis selon le type de client : petit chantier de particulier à J+2, J+7, J+14 et clôture à J+21 ; projet important à J+3, J+10, J+21 et clôture à J+35 ; client professionnel autour de la date de décision ; marché public sans relance commerciale</title>
  <rect width="1200" height="640" rx="28" fill="#FAF9F6"/>

  <text x="48" y="66" font-size="14" font-weight="700" letter-spacing="2" fill="#5A4BFF">ÉTAPE 2 · LE CALENDRIER</text>
  <text x="48" y="100" font-size="26" font-weight="800" fill="#14151A">Un rythme de relance par type de devis</text>
  <path d="M340.0 150 V512" stroke="#E4E2DD" stroke-dasharray="3 5"/><text x="340.0" y="140" font-size="11.5" font-weight="700" letter-spacing="1" fill="#6C6A66" text-anchor="middle">ENVOI</text>
  <path d="M496.0 150 V512" stroke="#E4E2DD" stroke-dasharray="3 5"/><text x="496.0" y="140" font-size="11.5" font-weight="700" letter-spacing="1" fill="#6C6A66" text-anchor="middle">J+7</text>
  <path d="M652.0 150 V512" stroke="#E4E2DD" stroke-dasharray="3 5"/><text x="652.0" y="140" font-size="11.5" font-weight="700" letter-spacing="1" fill="#6C6A66" text-anchor="middle">J+14</text>
  <path d="M808.0 150 V512" stroke="#E4E2DD" stroke-dasharray="3 5"/><text x="808.0" y="140" font-size="11.5" font-weight="700" letter-spacing="1" fill="#6C6A66" text-anchor="middle">J+21</text>
  <path d="M964.0 150 V512" stroke="#E4E2DD" stroke-dasharray="3 5"/><text x="964.0" y="140" font-size="11.5" font-weight="700" letter-spacing="1" fill="#6C6A66" text-anchor="middle">J+28</text>
  <path d="M1120.0 150 V512" stroke="#E4E2DD" stroke-dasharray="3 5"/><text x="1120.0" y="140" font-size="11.5" font-weight="700" letter-spacing="1" fill="#6C6A66" text-anchor="middle">J+35</text>
  <text x="48" y="178" font-size="17" font-weight="800" fill="#14151A">Petit chantier</text><text x="48" y="199" font-size="17" font-weight="800" fill="#14151A">de particulier</text><text x="48" y="219" font-size="12.5" fill="#6C6A66">Dépannage, reprise, petite maçonnerie</text>
  <circle cx="340" cy="186" r="6" fill="#14151A"/>
  <path d="M340 186 H808.0" stroke="#14151A" stroke-width="2.5"/>
  <circle cx="384.6" cy="186" r="13" fill="#5A4BFF"/><text x="384.6" y="191" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="384.6" y="218" font-size="12.5" font-weight="700" fill="#14151A" text-anchor="middle">J+2</text><circle cx="496.0" cy="186" r="13" fill="#5A4BFF"/><text x="496.0" y="191" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="496.0" y="218" font-size="12.5" font-weight="700" fill="#14151A" text-anchor="middle">J+7</text><circle cx="652.0" cy="186" r="13" fill="#5A4BFF"/><text x="652.0" y="191" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="652.0" y="218" font-size="12.5" font-weight="700" fill="#14151A" text-anchor="middle">J+14</text><rect x="796.0" y="174" width="24" height="24" rx="7" fill="#14151A"/><path d="M803.0 181 l10 10 m0 -10 l-10 10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><text x="808.0" y="218" font-size="12.5" font-weight="700" fill="#14151A" text-anchor="middle">Clôture J+21</text>
  <text x="48" y="270" font-size="17" font-weight="800" fill="#14151A">Projet important</text><text x="48" y="291" font-size="17" font-weight="800" fill="#14151A">de particulier</text><text x="48" y="311" font-size="12.5" fill="#6C6A66">Extension, maison, rénovation lourde</text>
  <circle cx="340" cy="278" r="6" fill="#14151A"/>
  <path d="M340 278 H1120.0" stroke="#14151A" stroke-width="2.5"/>
  <circle cx="406.9" cy="278" r="13" fill="#5A4BFF"/><text x="406.9" y="283" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="406.9" y="310" font-size="12.5" font-weight="700" fill="#14151A" text-anchor="middle">J+3</text><circle cx="562.9" cy="278" r="13" fill="#5A4BFF"/><text x="562.9" y="283" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="562.9" y="310" font-size="12.5" font-weight="700" fill="#14151A" text-anchor="middle">J+10</text><circle cx="808.0" cy="278" r="13" fill="#5A4BFF"/><text x="808.0" y="283" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="808.0" y="310" font-size="12.5" font-weight="700" fill="#14151A" text-anchor="middle">J+21</text><rect x="1104.0" y="266" width="24" height="24" rx="7" fill="#14151A"/><path d="M1111.0 273 l10 10 m0 -10 l-10 10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><text x="1116.0" y="310" font-size="12.5" font-weight="700" fill="#14151A" text-anchor="middle">Clôture J+35</text>
  <text x="48" y="372" font-size="17" font-weight="800" fill="#14151A">Client professionnel</text><text x="48" y="393" font-size="12.5" fill="#6C6A66">Maître d'œuvre, entreprise générale</text>
  <circle cx="340" cy="370" r="6" fill="#14151A"/>
  <path d="M340 370 H919.4" stroke="#14151A" stroke-width="2.5"/><path d="M919.4 370 H1120.0" stroke="#14151A" stroke-width="2.5" stroke-dasharray="4 6"/>
  <path d="M763.4 344 V384" stroke="#E5484D" stroke-width="2.5"/><text x="763.4" y="338" font-size="12" font-weight="700" fill="#E5484D" text-anchor="middle">Date de décision annoncée</text>
  <circle cx="406.9" cy="370" r="13" fill="#5A4BFF"/><text x="406.9" y="375" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="406.9" y="402" font-size="12.5" font-weight="700" fill="#14151A" text-anchor="middle">J+3 · réception</text><circle cx="719.4" cy="370" r="13" fill="#5A4BFF"/><text x="719.4" y="375" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="719.4" y="402" font-size="12.5" font-weight="700" fill="#14151A" text-anchor="middle">Avant</text><circle cx="807.4" cy="370" r="13" fill="#5A4BFF"/><text x="807.4" y="375" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="807.4" y="402" font-size="12.5" font-weight="700" fill="#14151A" text-anchor="middle">Juste après</text><text x="1120.0" y="402" font-size="12.5" font-weight="700" fill="#14151A" text-anchor="end">Clôture selon le projet</text>
  <text x="48" y="464" font-size="17" font-weight="800" fill="#14151A">Marché public</text><text x="48" y="485" font-size="12.5" fill="#6C6A66">Appel d'offres</text>
  <circle cx="340" cy="462" r="6" fill="#14151A"/>
  <path d="M340 462 H1120.0" stroke="#6C6A66" stroke-width="2.5" stroke-dasharray="4 6"/>
  <rect x="384.6" y="445" width="700" height="34" rx="17" fill="#fff" stroke="#14151A" stroke-width="1.5"/><text x="734.6" y="467" font-size="13.5" font-weight="700" fill="#14151A" text-anchor="middle">Pas de relance commerciale : attendre la décision, puis demander les motifs en cas de rejet</text>
  <g transform="translate(48 548)" font-size="13" fill="#14151A">
    <circle cx="9" cy="8" r="9" fill="#5A4BFF"/><text x="26" y="12.5">Relance</text>
    <rect x="104" y="-1" width="18" height="18" rx="5" fill="#14151A"/><text x="130" y="12.5">Message de clôture</text>
  </g>
  <g transform="translate(48 580)">
    <rect width="1104" height="42" rx="14" fill="#14151A"/>
    <text x="552" y="27" font-size="14.5" font-weight="600" fill="#fff" text-anchor="middle">Calendrier indicatif, à ajuster selon vos taux de réponse. Une réponse du client arrête la séquence.</text>
  </g>
</svg>
