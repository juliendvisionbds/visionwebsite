<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Rapprochement mensuel : 412 380 € selon la facturation, 409 860 € selon la comptabilité, un écart de 2 520 € expliqué par un avoir daté différemment (1 800 €) et des frais de benne classés en produits annexes (720 €), écart résiduel nul (exemple fictif)</title>
  <rect width="1200" height="640" rx="28" fill="#FAF9F6"/>

  <text x="48" y="66" font-size="14" font-weight="700" letter-spacing="2" fill="#5A4BFF">ÉTAPE 4 · LE RAPPROCHEMENT DU MOIS</text>
  <text x="48" y="100" font-size="26" font-weight="800" fill="#14151A">Un écart n'est pas une erreur, tant qu'il est expliqué</text>
  <g transform="translate(48 136)">
    <rect x="7" y="7" width="410" height="140" rx="20" fill="#EDEBFF"/>
    <rect width="410" height="140" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <text x="24" y="38" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#5A4BFF">CA DU MOIS · FACTURATION</text>
    <text x="24" y="92" font-size="40" font-weight="800" fill="#14151A">412 380 €</text>
    <text x="24" y="120" font-size="13" fill="#6C6A66">Export du logiciel de devis et facturation</text>
  </g>
  <g transform="translate(742 136)">
    <rect x="7" y="7" width="410" height="140" rx="20" fill="#EDEBFF"/>
    <rect width="410" height="140" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <text x="24" y="38" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#5A4BFF">CA DU MOIS · COMPTABILITÉ</text>
    <text x="24" y="92" font-size="40" font-weight="800" fill="#14151A">409 860 €</text>
    <text x="24" y="120" font-size="13" fill="#6C6A66">Comptes de ventes de travaux</text>
  </g>
  <g transform="translate(600 206)">
    <circle r="66" fill="#14151A"/>
    <text y="-14" font-size="11" font-weight="700" letter-spacing="1.2" fill="#FFC64D" text-anchor="middle">ÉCART</text>
    <text y="14" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">2 520 €</text>
    <text y="34" font-size="11.5" fill="#fff" opacity=".75" text-anchor="middle">à expliquer</text>
  </g>
  <text x="48" y="326" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#6C6A66">D'OÙ VIENT L'ÉCART</text>
  <clipPath id="eb"><rect x="48" y="342" width="1104" height="56" rx="14"/></clipPath>
  <g clip-path="url(#eb)"><rect x="48" y="342" width="788.6" height="56" fill="#FFC64D"/><rect x="836.6" y="342" width="315.4" height="56" fill="#FF8A7A"/></g>
  <rect x="48" y="342" width="1104" height="56" rx="14" fill="none" stroke="#14151A" stroke-width="2"/><path d="M836.6 342 v56" stroke="#14151A" stroke-width="2"/>
  <text x="68" y="377" font-size="18" font-weight="800" fill="#14151A">1 800 €</text><text x="856.6" y="377" font-size="18" font-weight="800" fill="#14151A">720 €</text>
  <text x="48" y="430" font-size="15" font-weight="700" fill="#14151A">Avoir A-2026-014 : une date, deux mois</text>
  <text x="48" y="451" font-size="13.5" fill="#6C6A66">Daté du 31/10 en comptabilité, du 03/11 dans le logiciel.</text>
  <text x="836.6" y="430" font-size="15" font-weight="700" fill="#14151A">Frais de benne refacturés</text>
  <text x="836.6" y="451" font-size="13.5" fill="#6C6A66">Classés en produits annexes en comptabilité.</text>
  <g transform="translate(48 482)">
    <rect width="1104" height="56" rx="16" fill="#E3F9F2" stroke="#14151A" stroke-width="2"/>
    <circle cx="32" cy="28" r="14" fill="#25D3A4"/><path d="M26.5 28 l4 4 l7 -8" fill="none" stroke="#14151A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="34" font-size="17" font-weight="800" fill="#14151A">Écart résiduel : 0 €</text>
    <text x="1080" y="34" font-size="14" fill="#14151A" text-anchor="end">Les règles de l'étape 3 disent quel chiffre retenir : le mois peut être diffusé.</text>
  </g>
  <text x="48" y="600" font-size="13" fill="#6C6A66">Exemple fictif.</text>
</svg>
