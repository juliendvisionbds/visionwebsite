<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Schéma d'un reporting BTP en trois colonnes : les sources (journal des ventes, balance, situations, pointage et achats, banque), la préparation et les contrôles (tables de correspondance, règles, rapprochement, anomalies, journal des écarts), puis les indicateurs</title>
  <rect width="1200" height="640" rx="28" fill="#FAF9F6"/>

  <text x="48" y="66" font-size="14" font-weight="700" letter-spacing="2" fill="#5A4BFF">ÉTAPE 5 · LE SCHÉMA COMPLET</text>
  <text x="48" y="100" font-size="26" font-weight="800" fill="#14151A">Des exports aux indicateurs, en passant par les contrôles</text>
  <g transform="translate(48 136)">
    <rect x="7" y="7" width="320" height="404" rx="20" fill="#EDEBFF"/>
    <rect width="320" height="404" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <text x="22" y="38" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#5A4BFF">1 · SOURCES</text><text x="22" y="68" font-size="19" font-weight="800" fill="#14151A">Les exports du mois</text>
    <path d="M0 88 H320" stroke="#14151A" stroke-width="2"/>
    <rect x="22" y="108" width="38" height="24" rx="6" fill="#1F7A45"/><text x="41" y="124" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">XLS</text><text x="74" y="125" font-size="15" font-weight="700" fill="#14151A">Journal des ventes</text>
    <path d="M22 151 H298" stroke="#E4E2DD"/>
    <rect x="22" y="171" width="38" height="24" rx="6" fill="#1F7A45"/><text x="41" y="187" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">XLS</text><text x="74" y="188" font-size="15" font-weight="700" fill="#14151A">Balance comptable</text>
    <path d="M22 214 H298" stroke="#E4E2DD"/>
    <rect x="22" y="234" width="38" height="24" rx="6" fill="#1F7A45"/><text x="41" y="250" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">XLS</text><text x="74" y="251" font-size="15" font-weight="700" fill="#14151A">Situations de travaux</text>
    <path d="M22 277 H298" stroke="#E4E2DD"/>
    <rect x="22" y="297" width="38" height="24" rx="6" fill="#6C6A66"/><text x="41" y="313" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">CSV</text><text x="74" y="314" font-size="15" font-weight="700" fill="#14151A">Pointage, achats</text>
    <path d="M22 340 H298" stroke="#E4E2DD"/>
    <rect x="22" y="360" width="38" height="24" rx="6" fill="#6C6A66"/><text x="41" y="376" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">CSV</text><text x="74" y="377" font-size="15" font-weight="700" fill="#14151A">Banque</text>
  </g>
  <g transform="translate(440 136)">
    <rect width="320" height="404" rx="20" fill="#14151A" stroke="#14151A" stroke-width="2"/>
    <text x="22" y="38" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#FFC64D">2 · PRÉPARATION ET CONTRÔLES</text><text x="22" y="68" font-size="19" font-weight="800" fill="#fff">Ce qui rend les chiffres fiables</text>
    <path d="M0 88 H320" stroke="#fff" stroke-width="1" opacity=".2"/>
    <circle cx="36" cy="120" r="11" fill="#25D3A4"/><path d="M30.5 120 l4 4 l7 -8" fill="none" stroke="#14151A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="117" font-size="15" font-weight="700" fill="#fff">Tables de correspondance</text><text x="60" y="136" font-size="12.5" fill="#fff" opacity=".7">Clients, chantiers, activités, entités</text>
    <path d="M22 151 H298" stroke="#fff" opacity=".15"/>
    <circle cx="36" cy="183" r="11" fill="#25D3A4"/><path d="M30.5 183 l4 4 l7 -8" fill="none" stroke="#14151A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="180" font-size="15" font-weight="700" fill="#fff">Règles écrites</text><text x="60" y="199" font-size="12.5" fill="#fff" opacity=".7">Dates, avoirs, retenues, flux</text>
    <path d="M22 214 H298" stroke="#fff" opacity=".15"/>
    <circle cx="36" cy="246" r="11" fill="#25D3A4"/><path d="M30.5 246 l4 4 l7 -8" fill="none" stroke="#14151A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="243" font-size="15" font-weight="700" fill="#fff">Rapprochement des totaux</text><text x="60" y="262" font-size="12.5" fill="#fff" opacity=".7">Avec la comptabilité</text>
    <path d="M22 277 H298" stroke="#fff" opacity=".15"/>
    <circle cx="36" cy="309" r="11" fill="#25D3A4"/><path d="M30.5 309 l4 4 l7 -8" fill="none" stroke="#14151A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="306" font-size="15" font-weight="700" fill="#fff">Liste des anomalies</text><text x="60" y="325" font-size="12.5" fill="#fff" opacity=".7">À traiter avant diffusion</text>
    <path d="M22 340 H298" stroke="#fff" opacity=".15"/>
    <circle cx="36" cy="372" r="11" fill="#25D3A4"/><path d="M30.5 372 l4 4 l7 -8" fill="none" stroke="#14151A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="369" font-size="15" font-weight="700" fill="#fff">Journal des écarts</text><text x="60" y="388" font-size="12.5" fill="#fff" opacity=".7">Explication et responsable</text>
  </g>
  <g transform="translate(832 136)">
    <rect x="7" y="7" width="320" height="404" rx="20" fill="#EDEBFF"/>
    <rect width="320" height="404" rx="20" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <text x="22" y="38" font-size="11.5" font-weight="700" letter-spacing="1.3" fill="#5A4BFF">3 · INDICATEURS</text><text x="22" y="68" font-size="19" font-weight="800" fill="#14151A">Ce que lit le dirigeant</text>
    <path d="M0 88 H320" stroke="#14151A" stroke-width="2"/>
    <rect x="24" y="122" width="6" height="8" rx="1.5" fill="#5A4BFF"/><rect x="33" y="116" width="6" height="14" rx="1.5" fill="#5A4BFF"/><rect x="42" y="110" width="6" height="20" rx="1.5" fill="#5A4BFF"/><text x="62" y="117" font-size="15" font-weight="700" fill="#14151A">CA par client, chantier</text><text x="62" y="136" font-size="12.5" fill="#6C6A66">et par activité</text>
    <path d="M22 151 H298" stroke="#E4E2DD"/>
    <rect x="24" y="185" width="6" height="8" rx="1.5" fill="#5A4BFF"/><rect x="33" y="179" width="6" height="14" rx="1.5" fill="#5A4BFF"/><rect x="42" y="173" width="6" height="20" rx="1.5" fill="#5A4BFF"/><text x="62" y="188" font-size="15" font-weight="700" fill="#14151A">Tendances, concentration</text>
    <path d="M22 214 H298" stroke="#E4E2DD"/>
    <rect x="24" y="248" width="6" height="8" rx="1.5" fill="#5A4BFF"/><rect x="33" y="242" width="6" height="14" rx="1.5" fill="#5A4BFF"/><rect x="42" y="236" width="6" height="20" rx="1.5" fill="#5A4BFF"/><text x="62" y="251" font-size="15" font-weight="700" fill="#14151A">Production non facturée</text>
    <path d="M22 277 H298" stroke="#E4E2DD"/>
    <rect x="24" y="311" width="6" height="8" rx="1.5" fill="#5A4BFF"/><rect x="33" y="305" width="6" height="14" rx="1.5" fill="#5A4BFF"/><rect x="42" y="299" width="6" height="20" rx="1.5" fill="#5A4BFF"/><text x="62" y="306" font-size="15" font-weight="700" fill="#14151A">Marge par chantier</text><text x="62" y="325" font-size="12.5" fill="#6C6A66">Si les coûts sont affectés</text>
    <path d="M22 340 H298" stroke="#E4E2DD"/>
    <rect x="24" y="374" width="6" height="8" rx="1.5" fill="#5A4BFF"/><rect x="33" y="368" width="6" height="14" rx="1.5" fill="#5A4BFF"/><rect x="42" y="362" width="6" height="20" rx="1.5" fill="#5A4BFF"/><text x="62" y="377" font-size="15" font-weight="700" fill="#14151A">Trésorerie et encours</text>
  </g>
  <g transform="translate(379 338)"><path d="M0 0 H40" stroke="#5A4BFF" stroke-width="4" stroke-linecap="round"/><path d="M28 -11 L43 0 L28 11" fill="none" stroke="#5A4BFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(771 338)"><path d="M0 0 H40" stroke="#5A4BFF" stroke-width="4" stroke-linecap="round"/><path d="M28 -11 L43 0 L28 11" fill="none" stroke="#5A4BFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(48 566)">
    <rect width="1104" height="48" rx="16" fill="#14151A"/>
    <text x="552" y="30" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">La colonne du milieu est celle que la plupart des reportings sautent. C'est elle qui rend la troisième fiable.</text>
  </g>
</svg>
