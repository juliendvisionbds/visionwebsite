<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Une demande client, le devis généré et modifiable, puis le PDF validé (données fictives)</title>
  <rect width="1200" height="640" rx="28" fill="#FAF9F6"/>

  <!-- ===== 1. La demande ===== -->
  <text x="48" y="66" font-size="14" font-weight="700" letter-spacing="2" fill="#6C6A66">1 · LA DEMANDE</text>
  <text x="48" y="94" font-size="22" font-weight="800" fill="#14151A">Copiée dans l'espace IA</text>
  <g transform="translate(48 122)">
    <rect width="300" height="430" rx="18" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <text x="20" y="36" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6C6A66">MESSAGE DU CLIENT</text>
    <rect x="18" y="52" width="264" height="196" rx="14" fill="#EFEDE8"/>
    <g font-size="12.5" fill="#14151A">
      <text x="34" y="80">Bonjour, nous souhaitons</text>
      <text x="34" y="100">créer une plateforme pour</text>
      <text x="34" y="120">un bâtiment de stockage</text>
      <text x="34" y="140">d'environ 600 m², avec</text>
      <text x="34" y="160">décapage, terrassement,</text>
      <text x="34" y="180">couche de forme et un</text>
      <text x="34" y="200">dallage béton. Pouvez-vous</text>
      <text x="34" y="220">nous faire un devis ?</text>
    </g>
    <rect x="18" y="268" width="264" height="96" rx="14" fill="#EDEBFF"/>
    <rect x="34" y="284" width="22" height="22" rx="7" fill="#5A4BFF"/>
    <text x="45" y="300" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">IA</text>
    <text x="66" y="300" font-size="12.5" font-weight="700" fill="#5A4BFF">Analyse de la demande</text>
    <text x="34" y="330" font-size="12" fill="#14151A">Bibliothèque de prix</text>
    <text x="34" y="348" font-size="12" fill="#14151A">+ anciens devis de l'entreprise</text>
    <rect x="18" y="382" width="264" height="30" rx="15" fill="#fff" stroke="#E4E2DD"/>
    <text x="34" y="402" font-size="12" fill="#6C6A66">Préparer le devis…</text>
  </g>

  <g transform="translate(366 330)">
    <path d="M0 0 H50" stroke="#5A4BFF" stroke-width="4" stroke-linecap="round"/>
    <path d="M38 -11 L53 0 L38 11" fill="none" stroke="#5A4BFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== 2. Le devis modifiable ===== -->
  <text x="436" y="66" font-size="14" font-weight="700" letter-spacing="2" fill="#5A4BFF">2 · LE DEVIS</text>
  <text x="436" y="94" font-size="22" font-weight="800" fill="#14151A">Prérempli, à contrôler</text>
  <g transform="translate(436 122)">
    <rect width="380" height="430" rx="18" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <text x="20" y="34" font-size="13" font-weight="700" fill="#14151A">Devis · Plateforme stockage 600 m²</text>
    <g font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#6C6A66">
      <text x="20" y="66">PRESTATION</text><text x="214" y="66">QTÉ</text><text x="262" y="66">P.U.</text><text x="360" y="66" text-anchor="end">TOTAL</text>
    </g>
    <path d="M20 76 H360" stroke="#EFEDE8"/>
    <g font-size="12" fill="#14151A">
      <text x="20" y="102">Décapage terre végétale</text><text x="214" y="102">180 m³</text><text x="262" y="102">6,20</text><text x="360" y="102" text-anchor="end">1 116 €</text>
      <path d="M20 116 H360" stroke="#F3F1EC"/>
      <rect x="12" y="122" width="356" height="34" rx="8" fill="#FFF3D1" stroke="#FFC42E" stroke-width="1.5"/>
      <text x="20" y="144">Terrassement pleine masse</text><text x="214" y="144" font-weight="700">420 m³</text><text x="262" y="144">18,40</text><text x="360" y="144" text-anchor="end">7 728 €</text>
      <text x="20" y="184">Couche de forme 0/31,5</text><text x="214" y="184">180 m³</text><text x="262" y="184">32,50</text><text x="360" y="184" text-anchor="end">5 850 €</text>
      <path d="M20 198 H360" stroke="#F3F1EC"/>
      <text x="20" y="224">Dallage béton ép. 15 cm</text><text x="214" y="224">600 m²</text><text x="262" y="224">48,00</text><text x="360" y="224" text-anchor="end">28 800 €</text>
      <path d="M20 238 H360" stroke="#F3F1EC"/>
      <text x="20" y="264">Évacuation des terres</text><text x="214" y="264">240 m³</text><text x="262" y="264">11,80</text><text x="360" y="264" text-anchor="end">2 832 €</text>
    </g>
    <rect x="20" y="282" width="340" height="30" rx="8" fill="none" stroke="#5A4BFF" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="34" y="302" font-size="12" font-weight="700" fill="#5A4BFF">+ Ajouter une ligne</text>
    <path d="M20 330 H360" stroke="#14151A" stroke-width="1.5"/>
    <text x="20" y="356" font-size="13" font-weight="700" fill="#14151A">Total HT</text><text x="360" y="356" font-size="15" font-weight="800" fill="#14151A" text-anchor="end">46 326 €</text>
    <rect x="20" y="376" width="340" height="38" rx="10" fill="#EDEBFF"/>
    <text x="36" y="400" font-size="12" fill="#14151A"><tspan font-weight="700" fill="#5A4BFF">Vous reprenez la main :</tspan> relire, ajuster, compléter.</text>
  </g>

  <g transform="translate(834 330)">
    <path d="M0 0 H50" stroke="#5A4BFF" stroke-width="4" stroke-linecap="round"/>
    <path d="M38 -11 L53 0 L38 11" fill="none" stroke="#5A4BFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="26" y="-20" font-size="12" font-weight="700" fill="#5A4BFF" text-anchor="middle">Valider</text>
  </g>

  <!-- ===== 3. Le PDF ===== -->
  <text x="904" y="66" font-size="14" font-weight="700" letter-spacing="2" fill="#6C6A66">3 · LE PDF</text>
  <text x="904" y="94" font-size="22" font-weight="800" fill="#14151A">Prêt à envoyer</text>
  <g transform="translate(910 128) rotate(2)">
    <rect width="246" height="420" rx="6" fill="#fff" stroke="#14151A" stroke-width="2"/>
    <rect x="20" y="22" width="40" height="40" rx="8" fill="#14151A"/>
    <text x="40" y="47" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">LOGO</text>
    <text x="226" y="40" font-size="15" font-weight="800" fill="#14151A" text-anchor="end">DEVIS</text>
    <text x="226" y="58" font-size="11" fill="#6C6A66" text-anchor="end">n° 2026-214</text>
    <rect x="20" y="86" width="120" height="8" rx="4" fill="#E4E2DD"/><rect x="20" y="102" width="90" height="8" rx="4" fill="#E4E2DD"/>
    <path d="M20 130 H226" stroke="#14151A" stroke-width="1.5"/>
    <g fill="#E4E2DD">
      <rect x="20" y="148" width="130" height="8" rx="4"/><rect x="186" y="148" width="40" height="8" rx="4"/>
      <rect x="20" y="172" width="110" height="8" rx="4"/><rect x="186" y="172" width="40" height="8" rx="4"/>
      <rect x="20" y="196" width="140" height="8" rx="4"/><rect x="186" y="196" width="40" height="8" rx="4"/>
      <rect x="20" y="220" width="120" height="8" rx="4"/><rect x="186" y="220" width="40" height="8" rx="4"/>
      <rect x="20" y="244" width="100" height="8" rx="4"/><rect x="186" y="244" width="40" height="8" rx="4"/>
    </g>
    <path d="M20 272 H226" stroke="#14151A" stroke-width="1.5"/>
    <text x="20" y="298" font-size="12.5" font-weight="700" fill="#14151A">Total HT</text>
    <text x="226" y="298" font-size="14" font-weight="800" fill="#14151A" text-anchor="end">46 326 €</text>
    <rect x="20" y="330" width="206" height="44" rx="10" fill="#E6F7EF"/>
    <circle cx="42" cy="352" r="10" fill="#25D3A4"/>
    <path d="M37 352 l3.5 3.5 l7 -7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="357" font-size="12.5" font-weight="700" fill="#14151A">Validé, PDF généré</text>
  </g>

  <text x="1152" y="616" font-size="12" fill="#6C6A66" text-anchor="end">Illustration avec des données fictives</text>
</svg>
